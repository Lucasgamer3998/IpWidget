# Builds the app and widget on every push and pull request to main.
# Code signing is turned off, so no Apple account or secrets are needed.
name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IpWidget
    # The project targets macOS 27, which needs Xcode 27 (Apple Silicon runner).
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project IpWidget.xcodeproj \
            -scheme IpWidget \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
